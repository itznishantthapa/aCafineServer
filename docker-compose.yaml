version: '3.8'

services:
  db:
    image: mysql
    container_name: mysql_db
    environment:
      MYSQL_DATABASE: acafine
      MYSQL_USER: nishantu
      MYSQL_PASSWORD: ntstyle123
      MYSQL_ROOT_PASSWORD: ntstyle123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_app
    working_dir: /app
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
    name: mysql_data
